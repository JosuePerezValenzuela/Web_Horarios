name: web_horarios

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
      target: development
    image: web_horarios:dev
    container_name: web_horarios
    user: node
    working_dir: /app
    environment:
      - NODE_ENV=development
    volumes:
      # Código fuente montado en caliente
      - ..:/app
    ports:
      - "8000:8000"
    command: sleep infinity
