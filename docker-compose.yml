services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    image: web_horarios:dev
    user: node
    working_dir: ${PWD:?PWD must point to the main repository root}
    environment:
      NODE_ENV: development
      TZ: America/La_Paz
      NEXT_PUBLIC_TIMEZONE: America/La_Paz
    volumes:
      # Mount the current checkout at its original WSL absolute path.
      - type: bind
        source: .
        target: ${PWD:?PWD must point to the main repository root}
      # Mount the dedicated worktree directory at its original WSL path.
      - type: bind
        source: ../Web_Horarios-worktrees
        target: ${PWD:?PWD must point to the main repository root}/../Web_Horarios-worktrees
    ports:
      - "${DEV_PORT:-8000}:8002"
    init: true
    command: ["sleep", "infinity"]
